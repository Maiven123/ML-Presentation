              <div class="glass-panel p-7 rounded-3xl border border-white/10 text-center space-y-6">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs sm:text-sm font-bold">
                  <i data-lucide="scan-line" class="w-4 h-4"></i> Scan for Presentation & Notebook
                </div>

                <!-- Exact QR Code Container -->
                <div class="flex justify-center my-3">
                  <div class="p-3.5 bg-white rounded-3xl shadow-2xl shadow-cyan-500/30 border-2 border-cyan-400/60 inline-block transition hover:scale-105 duration-300">
                    <img id="qr-code-img" src="${USER_QR_IMAGE}" alt="Presentation QR Code" class="w-52 h-52 object-contain rounded-xl" />
                  </div>
                </div>

                <div>
                  <h3 class="text-xl font-extrabold text-white">Thank You for Your Time</h3>
                  <p class="text-xs sm:text-sm text-slate-300 mt-1">Open for technical questions & architectural discussions.</p>
                </div>

                <div class="p-4 rounded-2xl bg-black/50 border border-white/10 text-left text-xs sm:text-sm font-mono space-y-2 text-slate-300">
                  <div class="text-cyan-400 font-bold">• Technical Deep-Dive Topics:</div>
                  <div class="text-slate-300">→ ROC-AUC & Precision-Recall (PR) Curves</div>
                  <div class="text-slate-300">→ Imbalance Strategies (SMOTE, Class Weights, Focal Loss)</div>
                  <div class="text-slate-300">→ Threshold Calibration for Optimal Utility</div>
                </div>
              </div>
            </div>
          </div>
        `
      }
    ];

    // State Variables
    let currentSlide = 0;
    let currentMetricTab = 'accuracy';

    // Metrics Data for Interactive Tab with Single-Line Horizontal Fraction Denominators
    const metricsData = {
      accuracy: {
        title: "Accuracy",
        symbol: "Acc",
        conceptQuestion: "Out of all predictions made, what percentage was universally correct?",
        numerator: "TP + TN",
        denominator: "TP + TN + FP + FN",
        variables: [
          { name: "TP (True Positives)", desc: "Correct positive identifications" },
          { name: "TN (True Negatives)", desc: "Correct negative identifications" },
          { name: "Total Population", desc: "Sum of all TP + TN + FP + FN" }
        ],
        whenToUse: "ONLY appropriate when datasets have balanced class frequencies (~50/50) and error penalties are symmetric.",
        whenFails: "Completely collapses on imbalanced distributions (Fraud, Cyber Intrusions, Medical Diagnostics).",
        costPerspective: "Treats false alarms and deadly missed events as mathematically indistinguishable."
      },
      precision: {
        title: "Precision (Positive Predictive Value)",
        symbol: "Prec",
        conceptQuestion: "When the model sounds an alarm, how likely is it to be a real event?",
        numerator: "TP",
        denominator: "TP + FP",
        variables: [
          { name: "TP (True Positives)", desc: "Genuine positive instances correctly caught" },
          { name: "FP (False Positives)", desc: "False alarms incorrectly flagged as positive" }
        ],
        whenToUse: "Crucial when the financial, reputational, or workflow cost of a False Alarm (FP) is high.",
        whenFails: "If over-optimized, the model refuses to predict positive except under extreme certainty, missing many actual cases.",
        costPerspective: "Focuses on Alarm Reliability: 'If I ring the bell, you can be confident there is a fire.'"
      },
      recall: {
        title: "Recall (Sensitivity / True Positive Rate)",
        symbol: "Rec",
        conceptQuestion: "Out of all actual positive cases in reality, how many did we capture?",
        numerator: "TP",
        denominator: "TP + FN",
        variables: [
          { name: "TP (True Positives)", desc: "Positive cases successfully identified" },
          { name: "FN (False Negatives)", desc: "Positive cases missed by the model" }
        ],
        whenToUse: "Essential when the consequence of a Missed Case (FN) is fatal, illegal, or catastrophic.",
        whenFails: "If over-optimized, the model can simply classify all samples as positive, causing massive false alarm fatigue.",
        costPerspective: "Focuses on Thoroughness: 'Leave no stone unturned; miss zero positive cases.'"
      },
      f1: {
        title: "F1-Score (Harmonic Mean)",
        symbol: "F1",
        conceptQuestion: "How well does the model balance precision and recall without gaming either one?",
        numerator: "2 × Precision × Recall",
        denominator: "Precision + Recall",
        variables: [
          { name: "Precision & Recall", desc: "Harmonic mean forces both metrics to remain reasonably balanced" },
          { name: "Harmonic Penalty", desc: "Severely penalizes models with one high and one near-zero score" }
        ],
        whenToUse: "The standard metric for imbalanced classification benchmarks where both FP and FN matter.",
        whenFails: "Weights Precision and Recall symmetrically. If one error type is fundamentally more dangerous, use F-beta instead.",
        costPerspective: "Non-linear penalty: If Precision is 100% but Recall drops to 0%, F1 is 0% (not 50%)."
      }
    };

    // Initialize Presentation
    function initPresentation() {
      renderIndicators();
      renderSlide(currentSlide);
      setupEvents();
    }

    // Render Indicator Dots
    function renderIndicators() {
      const container = document.getElementById('slide-indicators');
      container.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="h-2.5 rounded-full transition-all duration-300 ${idx === currentSlide ? 'w-9 bg-cyan-400' : 'w-2.5 bg-white/20 hover:bg-white/40'}" title="${s.title}"></button>
      `).join('');
    }

    // Render Slide Content
    function renderSlide(index) {
      const slide = slides[index];
      const container = document.getElementById('slide-container');

      container.style.opacity = '0';
      container.style.transform = 'translateY(10px)';

      setTimeout(() => {
        container.innerHTML = `
          <div class="glass-panel rounded-3xl p-8 sm:p-12 border border-white/10 relative overflow-hidden shadow-2xl">
            <!-- Header Tag -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-7 pb-5 border-b border-white/10">
              <div>
                <span class="text-xs sm:text-sm font-mono font-extrabold tracking-widest text-cyan-400 uppercase">${slide.tag}</span>
                <h2 class="text-3xl sm:text-4xl font-black text-white mt-1">${slide.title}</h2>
                <p class="text-sm sm:text-base text-slate-300 font-medium">${slide.subtitle}</p>
              </div>
              <div>
                <span class="text-xs sm:text-sm px-4 py-1.5 rounded-full bg-white/5 border border-white/10 font-mono text-slate-200 font-bold">Slide ${index + 1} of ${slides.length}</span>
              </div>
            </div>

            <!-- Slide Body -->
            <div class="mt-4">
              ${slide.content}
            </div>
          </div>
        `;

        renderIndicators();
        document.getElementById('slide-counter').innerText = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
        document.getElementById('slide-title-preview').innerText = slide.title;
        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').innerHTML = index === slides.length - 1 
          ? `<span>Completed</span><i data-lucide="check" class="w-4 h-4"></i>`
          : `<span>Next Slide</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;

        lucide.createIcons();
        if (slide.id === 'interactive-metrics') {
          switchMetric(currentMetricTab);
        } else if (slide.id === 'live-simulator') {
          recalcSimulator();
        }

        container.style.opacity = '1';
        container.style.transform = 'translateY(0)';
      }, 150);
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < slides.length) {
        currentSlide = idx;
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    // Interactive Metric Switcher Logic (Single-line horizontal fraction denominator)
    function switchMetric(metricKey) {
      currentMetricTab = metricKey;
      const data = metricsData[metricKey];
      if (!data) return;

      const buttons = document.querySelectorAll('.metric-tab-btn');
      buttons.forEach(btn => {
        const target = btn.getAttribute('data-target');
        if (target === metricKey) {
          btn.className = 'metric-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg';
        } else {
          btn.className = 'metric-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-2 text-slate-300 hover:text-white hover:bg-white/5';
        }
      });

      const container = document.getElementById('metric-detail-card');
      if (!container) return;

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          <div class="lg:col-span-6 space-y-5">
            <div class="flex items-center gap-4">
              <span class="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center font-black text-lg border border-cyan-500/30">
                ${data.symbol}
              </span>
              <div>
                <h3 class="text-2xl font-black text-white">${data.title}</h3>
                <p class="text-xs sm:text-sm text-slate-300 font-medium">${data.conceptQuestion}</p>
              </div>
            </div>

            <!-- Mathematical Formula Display with Denominator on a SINGLE Horizontal Line -->
            <div class="p-6 rounded-2xl bg-black/60 border border-white/10 flex flex-col sm:flex-row items-center justify-center gap-4 py-8 shadow-inner">
              <div class="text-xl font-mono font-extrabold text-white">${data.title} = </div>
              
              <div class="inline-flex flex-col items-center justify-center font-mono">
                <!-- Numerator -->
                <div class="px-5 py-1 text-lg sm:text-xl font-black text-cyan-300 tracking-wide text-center">
                  ${data.numerator}
                </div>
                <!-- Fraction Bar -->
                <div class="w-full h-1 bg-gradient-to-r from-cyan-500 via-emerald-400 to-amber-400 my-1 rounded-full"></div>
                <!-- Single-Line Horizontal Denominator -->
                <div class="px-5 py-1 text-lg sm:text-xl font-black text-emerald-300 tracking-wide text-center whitespace-nowrap">
                  ${data.denominator}
                </div>
              </div>
            </div>

            <!-- Formula Variable Definitions -->
            <div class="p-4 rounded-2xl bg-white/5 border border-white/5 space-y-2.5 text-xs sm:text-sm">
              <span class="font-bold text-slate-200 flex items-center gap-2 font-mono text-xs uppercase tracking-wider text-cyan-400">
                <i data-lucide="info" class="w-4 h-4"></i> Variables Legend
              </span>
              <ul class="space-y-1.5 text-slate-300">
                ${data.variables.map(v => `
                  <li class="flex items-center justify-between border-b border-white/5 pb-1.5">
                    <span class="font-mono text-cyan-300 font-bold">${v.name}</span>
                    <span class="text-slate-300 text-xs">${v.desc}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <div class="lg:col-span-6 space-y-4">
            <div class="p-5 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 space-y-2">
              <div class="text-sm font-bold text-emerald-400 flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> When to Optimize For This Metric:
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${data.whenToUse}</p>
            </div>

            <div class="p-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 space-y-2">
              <div class="text-sm font-bold text-rose-400 flex items-center gap-2">
                <i data-lucide="alert-octagon" class="w-4 h-4"></i> Critical Vulnerability:
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${data.whenFails}</p>
            </div>

            <div class="p-5 rounded-2xl border border-amber-500/30 bg-amber-500/10 space-y-2">
              <div class="text-sm font-bold text-amber-400 flex items-center gap-2">
                <i data-lucide="compass" class="w-4 h-4"></i> Core Intuition:
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${data.costPerspective}</p>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // Live Simulator Scenarios
    function loadScenario(type) {
      if (type === 'cancer') {
        document.getElementById('inp-tp').value = 0;
        document.getElementById('inp-fp').value = 0;
        document.getElementById('inp-fn').value = 10;
        document.getElementById('inp-tn').value = 990;
      } else if (type === 'spam') {
        document.getElementById('inp-tp').value = 95;
        document.getElementById('inp-fp').value = 2;
        document.getElementById('inp-fn').value = 15;
        document.getElementById('inp-tn').value = 888;
      } else if (type === 'balanced') {
        document.getElementById('inp-tp').value = 460;
        document.getElementById('inp-fp').value = 40;
        document.getElementById('inp-fn').value = 50;
        document.getElementById('inp-tn').value = 450;
      }
      recalcSimulator();
    }

    // Simulator Calculation
    function recalcSimulator() {
      const tp = Math.max(0, parseFloat(document.getElementById('inp-tp')?.value) || 0);
      const fp = Math.max(0, parseFloat(document.getElementById('inp-fp')?.value) || 0);
      const fn = Math.max(0, parseFloat(document.getElementById('inp-fn')?.value) || 0);
      const tn = Math.max(0, parseFloat(document.getElementById('inp-tn')?.value) || 0);

      const total = tp + fp + fn + tn;
      const simTotalEl = document.getElementById('sim-total');
      if (simTotalEl) simTotalEl.innerText = total;

      const acc = total > 0 ? ((tp + tn) / total) * 100 : 0;
      const prec = (tp + fp) > 0 ? (tp / (tp + fp)) * 100 : 0;
      const rec = (tp + fn) > 0 ? (tp / (tp + fn)) * 100 : 0;
      const f1 = (prec + rec) > 0 ? (2 * (prec * rec) / (prec + rec)) : 0;

      const setMetric = (id, val) => {
        const textEl = document.getElementById(`res-${id}`);
        const barEl = document.getElementById(`bar-${id}`);
        if (textEl) textEl.innerText = `${val.toFixed(1)}%`;
        if (barEl) barEl.style.width = `${Math.min(100, Math.max(0, val))}%`;
      };

      setMetric('accuracy', acc);
      setMetric('precision', prec);
      setMetric('recall', rec);
      setMetric('f1', f1);

      const verdictBox = document.getElementById('sim-verdict-box');
      if (verdictBox) {
        if (acc >= 95 && rec < 20) {
          verdictBox.className = 'p-4 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-200 text-xs sm:text-sm leading-relaxed font-medium';
          verdictBox.innerHTML = `⚠️ <strong>ACCURACY ILLUSION TRIGGERED:</strong> Accuracy appears stellar at <span class="font-bold underline">${acc.toFixed(1)}%</span>, yet Recall is disastrously low at <span class="font-bold underline">${rec.toFixed(1)}%</span>. The model is letting virtually all positive cases slip through undetected.`;
        } else if (prec > 90 && rec < 60) {
          verdictBox.className = 'p-4 rounded-2xl border border-cyan-500/40 bg-cyan-500/10 text-cyan-200 text-xs sm:text-sm leading-relaxed font-medium';
          verdictBox.innerHTML = `🛡️ <strong>HIGH PRECISION CONFIGURATION:</strong> Minimal False Alarms (${fp} false positives). Best suited for applications like spam filtering or automated payment blocks.`;
        } else if (rec > 90 && prec < 60) {
          verdictBox.className = 'p-4 rounded-2xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-200 text-xs sm:text-sm leading-relaxed font-medium';
          verdictBox.innerHTML = `🏥 <strong>HIGH RECALL CONFIGURATION:</strong> Catches nearly every actual positive case (${fn} missed cases). Optimal for healthcare diagnostics or airport threat screening.`;
        } else {
          verdictBox.className = 'p-4 rounded-2xl border border-white/10 bg-white/5 text-slate-200 text-xs sm:text-sm leading-relaxed font-medium';
          verdictBox.innerHTML = `⚖️ Balanced distribution. F1-Score: <strong class="text-amber-400 font-bold">${f1.toFixed(1)}%</strong> reliably reflects holistic model capability across both classes.`;
        }
      }
    }

    // Setup Event Listeners
    function setupEvents() {
      document.getElementById('next-btn').addEventListener('click', nextSlide);
      document.getElementById('prev-btn').addEventListener('click', prevSlide);

      // Keyboard arrow keys
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          nextSlide();
        } else if (e.key === 'ArrowLeft') {
          prevSlide();
        } else if (e.key === 'Home') {
          goToSlide(0);
        } else if (e.key === 'End') {
          goToSlide(slides.length - 1);
        }
      });

      // Fullscreen Toggle
      const fsBtn = document.getElementById('fullscreen-btn');
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {});
        } else {
          document.exitFullscreen();
        }
      });
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', initPresentation);
  </script>
</body>
</html>
